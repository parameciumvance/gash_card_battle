name: Test

# 全套測試(含瀏覽器測試):push / PR 到 main、dev 時執行;Deploy 推 tag 時也以 workflow_call 先跑這一份,通過才建置
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_call:

# 測試只需要讀取 repo:token 一律唯讀(相依套件與 action 的程式碼都在這個 job 裡執行,不能讓它們拿到寫入權限)。
# 被 Deploy 以 workflow_call 呼叫時,權限也不會超過這裡(docker-deployment「CI 的權限與相依鎖定」)
permissions:
  contents: read

# 同一分支有新推送時取消還在跑的舊測試;被 Deploy 呼叫時 ref 是 tag,各自一組
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # 全套約 8 分鐘,字型套件的鏡像站偶爾很慢(曾 12 分鐘);不設的話卡住的測試要 6 小時才失敗
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"   # 與 production 映像檔(python:3.14-slim)、開發容器相同
          cache: pip
          cache-dependency-path: requirements-dev.lock
      # 依 lock 檔安裝(版本與 hash 都固定,hash 不符就失敗);專案本身不再解析相依、不另外下載建置工具
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip install --no-deps --no-build-isolation -e .

      # 瀏覽器測試需要 Chromium;沒有時 tests/conftest.py 的 browser fixture 會整批略過。
      # 瀏覽器檔案依 playwright 版本快取;系統套件(--with-deps)每次以 apt 安裝
      - id: pw
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: python -m playwright install --with-deps chromium-headless-shell

      - run: pytest

      # 瀏覽器測試失敗時 tests/conftest.py 會截下當時的頁面
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
