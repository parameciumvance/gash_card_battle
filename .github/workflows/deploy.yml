name: Deploy

# 只有打版號 tag 才建置映像檔並推上 GHCR,一般 push 不會觸碰生產環境(見 test.yml)。
# 這個 workflow 只到「把新 image 推上 registry」為止——VPS 上的 watchtower 會自己
# 定期偵測新版並拉取重啟,CI 完全不需要連進 VPS、不需要 SSH 金鑰或加入任何 VPN。
# VPS 上須先完成一次性設置,見 README「VPS 部署」章節。
on:
  push:
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
