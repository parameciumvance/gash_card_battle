[project]
name = "gash-card-battle"
version = "0.1.0"
description = "金色のガッシュベル!! THE CARD BATTLE — 規則全自動裁決的 TCG 對戰網頁"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx2>=2.12",
    "openpyxl>=3.1",
    "opencc-python-reimplemented>=0.1.7",
    "pillow>=10.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 開發中跑 pytest -m "not slow";歸檔 / 提交前跑全套(AGENTS.md「測試」)
markers = [
  "slow: NPC 自我對戰與動畫等待類的瀏覽器測試(單項數秒以上),開發中可用 -m \"not slow\" 略過",
  "browser: 用到 Chromium 的瀏覽器測試(tests/conftest.py 自動標記)",
]
