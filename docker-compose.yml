# VPS 部署用。app 不對外開放埠,只有 caddy 對外;卡圖 volume 需手動放入(見 README「卡圖」)。
# 更新機制是 watchtower 定期 poll GHCR,不是 CI 主動 SSH 進來重啟——CI 只需要能 push
# image,完全不用碰這台機器的網路邊界(不加入 tailnet、不需要任何 SSH 金鑰)。
services:
  app:
    image: ghcr.io/parameciumvance/gash_card_battle:latest
    restart: unless-stopped
    environment:
      - GASH_ASSETS_DIR=/app/assets
    volumes:
      - card-assets:/app/assets
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/meta')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # 定期檢查 GHCR 上 `app` 服務用的 image 有沒有新版,有的話自動 pull + 重啟該容器
  # (WATCHTOWER_LABEL_ENABLE=true 讓它只管理有上面那個 label 的容器,不會去動 caddy
  # 或它自己)。這就是整個部署的「觸發點」——沒有 CI 主動連進來這件事。
  watchtower:
    # 原本的 containrrr/watchtower 已於 2025-12-17 由原作者封存(不再更新),
    # 舊版綁的 Docker API client 太舊,連不上新版 Docker Engine(`client version
    # 1.25 is too old` 這類錯誤,導致不斷重啟崩潰)。改用社群接手維護的分支,
    # 環境變數/label 完全相容,純換 image 名稱。
    image: ghcr.io/nicholas-fedor/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 若 GHCR package 是 private,VPS 上先 `docker login ghcr.io` 一次,
      # 再把產生的憑證檔掛給 watchtower 才能拉私有 image(見 README)。注意
      # compose 檔案不會展開 `~`,MUST 用 `${HOME}` 或絕對路徑:
      # - ${HOME}/.docker/config.json:/config.json:ro
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300

volumes:
  card-assets:
  caddy-data:
  caddy-config:
