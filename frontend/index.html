<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>金色のガッシュベル!! THE CARD BATTLE</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header id="topbar">
    <span id="title"></span>
    <span id="identity"></span>
    <span id="turn-info"></span>
    <span id="phase-info"></span>
    <span id="acting-info"></span>
    <span id="countdown"></span>
    <span id="conn-status"></span>
    <button id="leave-room" class="hidden"></button>
  </header>

  <!-- 入口頁 -->
  <section id="landing" class="hidden">
    <h1 id="landing-title"></h1>
    <div id="landing-cards">
      <div class="entry" id="entry-local">
        <h2></h2><p></p><button class="primary"></button>
      </div>
      <div class="entry" id="entry-create">
        <h2></h2><p></p>
        <label id="timer-label"></label>
        <select id="timer-select"></select>
        <button class="primary"></button>
      </div>
      <div class="entry" id="entry-join">
        <h2></h2><p></p>
        <input id="join-code" maxlength="6" placeholder="ABC123">
        <button class="primary"></button>
      </div>
    </div>
  </section>

  <!-- 等待對手 -->
  <section id="waiting" class="hidden">
    <h2 id="waiting-title"></h2>
    <div id="waiting-code" class="room-code"></div>
    <div class="share-row"><span id="share-join-label"></span>
      <input id="share-join" readonly><button data-copy="share-join"></button></div>
    <div class="share-row"><span id="share-spec-label"></span>
      <input id="share-spec" readonly><button data-copy="share-spec"></button></div>
  </section>

  <main id="layout" class="hidden">
    <section id="board">
      <div id="zone-top" class="player-zone top"></div>
      <div id="battle-strip"></div>
      <div id="zone-bottom" class="player-zone bottom"></div>
      <div id="action-bar"></div>
    </section>
    <aside id="log-panel">
      <h3 id="log-title"></h3>
      <div id="log"></div>
    </aside>
  </main>

  <div id="dialog-overlay" class="hidden">
    <div id="dialog">
      <h3 id="dialog-title"></h3>
      <div id="dialog-options"></div>
    </div>
  </div>

  <div id="zoom-overlay" class="hidden">
    <div id="zoom-card"></div>
  </div>

  <div id="toast" class="hidden"></div>

  <script src="/static/app.js"></script>
</body>
</html>
