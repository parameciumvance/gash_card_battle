<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gash Card Battle Online</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header id="topbar">
    <!-- 標題字(GASH / CARD BATTLE / ONLINE)與網站名稱 app.title 一致;螢幕閱讀器讀 aria-label -->
    <span id="title" role="img"><span class="wordmark small"><img class="wm-badge" src="/static/favicon.svg" alt=""><span class="wm-text"><span class="wm-gash">GASH</span><span class="wm-sub">CARD BATTLE</span><span class="wm-sub wm-online">ONLINE</span></span></span></span>
    <span id="identity"></span>
    <span id="turn-info"></span>
    <span id="phase-info"></span>
    <span id="acting-info"></span>
    <span id="countdown"></span>
    <span id="conn-status"></span>
    <button id="rules-toggle"></button>
    <button id="feedback-toggle"></button>
    <button id="lang-toggle"></button>
    <button id="prefs-toggle"></button>
    <button id="effects-toggle" class="hidden"></button>
    <button id="cheat-toggle" class="hidden"></button>
    <button id="leave-room" class="hidden"></button>
  </header>

  <!-- 入口頁 -->
  <section id="landing" class="hidden">
    <h1 id="landing-title"><span class="wordmark large"><img class="wm-badge" src="/static/favicon.svg" alt=""><span class="wm-text"><span class="wm-gash">GASH</span><span class="wm-sub">CARD BATTLE</span><span class="wm-sub wm-online">ONLINE</span></span></span></h1>
    <div id="assets-hint" class="hidden"></div>
    <div id="landing-cards">
      <button class="entry" id="entry-npc"><span class="entry-title"></span><span class="entry-desc"></span></button>
      <button class="entry" id="entry-friend"><span class="entry-title"></span><span class="entry-desc"></span></button>
      <button class="entry" id="entry-builder"><span class="entry-title"></span><span class="entry-desc"></span></button>
      <button class="entry" id="entry-local"><span class="entry-title"></span><span class="entry-desc"></span></button>
      <button class="entry" id="entry-rules"><span class="entry-title"></span><span class="entry-desc"></span></button>
      <button class="entry" id="entry-feedback"><span class="entry-title"></span><span class="entry-desc"></span></button>
    </div>
    <div id="landing-foot">
      <p id="landing-online" class="hidden"></p>
      <footer id="landing-disclaimer"><p id="disclaimer-fan"></p><p id="disclaimer-rights"></p></footer>
      <!-- 版本號與更新內容入口在免責聲明之外:免責聲明本身不放按鈕或入口 -->
      <p id="landing-version-line"><span id="landing-version"></span><button id="release-open" class="hidden"></button></p>
    </div>
  </section>

  <!-- 設定頁(NPC 對戰 / 與朋友對戰 / 自由調查時間,即本機測試模式) -->
  <section id="setup" class="hidden">
    <div id="setup-head">
      <button id="setup-back"></button>
      <h2 id="setup-title"></h2>
    </div>
    <div class="setup-panel" id="setup-npc">
      <label class="deck-label" id="name-npc-label" for="name-npc"></label>
      <input id="name-npc" class="name-input" maxlength="16">
      <label class="deck-label" id="deck-npc-label" for="deck-npc"></label>
      <select id="deck-npc" class="deck-select"></select>
      <label class="deck-label" id="deck-npc-opp-label" for="deck-npc-opp"></label>
      <select id="deck-npc-opp" class="deck-select"></select>
      <label class="deck-label" id="npc-level-label" for="npc-level"></label>
      <select id="npc-level"></select>
      <button class="primary" id="npc-start"></button>
    </div>
    <div class="setup-panel" id="setup-friend">
      <div id="friend-mode" class="seg">
        <button data-mode="create"></button><button data-mode="join"></button>
      </div>
      <p id="friend-desc"></p>
      <label class="deck-label" id="name-friend-label" for="name-friend"></label>
      <input id="name-friend" class="name-input" maxlength="16">
      <label class="deck-label" id="deck-friend-label" for="deck-friend"></label>
      <select id="deck-friend" class="deck-select"></select>
      <div class="field" id="friend-timer-row">
        <label class="deck-label" id="timer-label" for="timer-select"></label>
        <select id="timer-select"></select>
      </div>
      <div class="field" id="friend-code-row">
        <label class="deck-label" id="join-code-label" for="join-code"></label>
        <input id="join-code" maxlength="6" placeholder="ABC123">
      </div>
      <button class="primary" id="friend-submit"></button>
    </div>
    <div class="setup-panel" id="setup-local">
      <label class="deck-label" id="name-local-0-label" for="name-local-0"></label>
      <input id="name-local-0" class="name-input" maxlength="16">
      <label class="deck-label" id="deck-local-0-label" for="deck-local-0"></label>
      <select id="deck-local-0" class="deck-select"></select>
      <label class="deck-label" id="name-local-1-label" for="name-local-1"></label>
      <input id="name-local-1" class="name-input" maxlength="16">
      <label class="deck-label" id="deck-local-1-label" for="deck-local-1"></label>
      <select id="deck-local-1" class="deck-select"></select>
      <button class="primary" id="local-start"></button>
    </div>
  </section>

  <!-- 牌組構築器 -->
  <section id="builder" class="hidden">
    <div id="builder-head">
      <button id="builder-back"></button>
      <select id="builder-deck-list"></select>
      <select id="builder-new"></select>
      <input id="builder-name" maxlength="24">
      <button id="builder-save" class="primary"></button>
      <button id="builder-export"></button>
      <button id="builder-import"></button>
      <button id="builder-delete"></button>
    </div>
    <div id="builder-main">
      <div id="builder-pool">
        <div id="pool-filters"></div>
        <div id="pool-grid"></div>
      </div>
      <div id="builder-book">
        <div id="book-hint"></div>
        <div id="book-grid"></div>
      </div>
    </div>
    <div id="builder-validation"></div>
  </section>

  <div id="io-overlay" class="hidden">
    <div id="io-dialog">
      <h3 id="io-title"></h3>
      <textarea id="io-text" rows="4"></textarea>
      <div id="io-actions"></div>
    </div>
  </div>

  <!-- 等待對手 -->
  <section id="waiting" class="hidden">
    <h2 id="waiting-title"></h2>
    <div id="waiting-code" class="room-code"></div>
    <div class="share-row"><span id="share-join-label"></span>
      <input id="share-join" readonly><button data-copy="share-join"></button></div>
    <div class="share-row"><span id="share-spec-label"></span>
      <input id="share-spec" readonly><button data-copy="share-spec"></button></div>
  </section>

  <main id="layout" class="hidden">
    <section id="board">
      <div id="zone-top" class="player-zone top"></div>
      <div id="battle-stage"><div id="timing-track" class="hidden"></div><div id="stage-content"></div></div>
      <div id="zone-bottom" class="player-zone bottom"></div>
      <div id="action-bar">
        <div id="turn-cluster" class="hidden" role="status">
          <div id="turn-dial">
            <div class="dial-ring">
              <svg class="dial-arrow" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
                <path d="M 14.7 66.5 A 39 39 0 0 1 24.9 20.1" fill="none" stroke-width="5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
                <path d="M 19.8 14.0 L 34.9 11.7 L 30.0 26.2 Z"/>
                <path d="M 85.3 33.5 A 39 39 0 0 1 75.1 79.9" fill="none" stroke-width="5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
                <path d="M 80.2 86.0 L 65.1 88.3 L 70.0 73.8 Z"/>
              </svg>
            </div>
            <div class="dial-rotor"><span class="dial-tab"><span class="dial-tab-text"></span></span></div>
            <div class="dial-center"></div>
          </div>
          <div class="turn-side">
            <span id="acting-pointer"><span class="pointer-text"></span></span>
            <div id="dial-note" class="hidden"></div>
          </div>
        </div>
        <div id="action-main"></div>
      </div>
    </section>
    <aside id="log-panel">
      <h3 id="log-title"></h3>
      <div id="log"></div>
    </aside>
  </main>

  <dialog id="cheat-panel" aria-labelledby="cheat-title" aria-describedby="cheat-help">
    <div id="cheat-head">
      <h3 id="cheat-title"></h3>
      <button id="cheat-close" autofocus></button>
    </div>
    <p id="cheat-help"></p>
    <fieldset id="cheat-editor">
      <div id="cheat-toolbar">
        <div id="cheat-players" role="group"></div>
        <label id="cheat-mp-label" for="cheat-mp"></label>
        <input id="cheat-mp" type="number" step="1">
        <strong id="cheat-selection" aria-live="polite"></strong>
      </div>
      <div id="cheat-columns">
        <section id="cheat-book">
          <h4 id="cheat-book-title"></h4>
          <div id="cheat-book-grid"></div>
        </section>
        <section id="cheat-pool">
          <h4 id="cheat-pool-title"></h4>
          <div id="cheat-filters"></div>
          <div id="cheat-pool-grid"></div>
        </section>
      </div>
    </fieldset>
    <div id="cheat-error" class="hidden" role="alert"></div>
    <div id="cheat-actions">
      <span id="cheat-status" role="status"></span>
      <button id="cheat-refresh"></button>
      <button id="cheat-cancel"></button>
      <button id="cheat-apply" class="primary"></button>
    </div>
  </dialog>

  <div id="anim-overlay"></div>
  <!-- 對手行動聚焦展示:整批播完才重繪盤面;點擊跳過 -->
  <div id="spotlight" class="hidden" role="status" aria-live="polite"></div>

  <div id="dialog-overlay" class="hidden">
    <div id="dialog">
      <h3 id="dialog-title"></h3>
      <div id="dialog-source" class="hidden"></div>
      <div id="dialog-notes" class="hidden"></div>
      <div id="dialog-options"></div>
    </div>
  </div>

  <!-- 規則頁:首頁與對局中都可開啟,只是蓋在畫面上,不影響對局 -->
  <div id="rules-overlay" class="hidden">
    <div id="rules-dialog">
      <div id="rules-head"><h3 id="rules-title"></h3><button id="rules-close"></button></div>
      <div id="rules-main"><nav id="rules-toc"></nav><div id="rules-body"></div></div>
    </div>
  </div>

  <!-- 純展示資訊(魔力明細、作用中效果),不影響決策對話框 -->
  <div id="info-overlay" class="hidden">
    <div id="info-dialog">
      <div id="info-head"><h3 id="info-title"></h3><button id="info-close"></button></div>
      <div id="info-body"></div>
    </div>
  </div>

  <div id="zoom-overlay" class="hidden">
    <div id="zoom-card"></div>
    <div id="zoom-actions"></div>
  </div>

  <div id="book-review-overlay" class="hidden">
    <div id="book-review">
      <div id="book-review-head">
        <h3 id="book-review-title"></h3>
        <button id="book-review-close"></button>
      </div>
      <div id="book-review-grid"></div>
    </div>
  </div>

  <div id="toast" class="hidden"></div>

  <script src="/static/decks.js"></script>
  <script src="/static/sound.js"></script>
  <script src="/static/anim.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
