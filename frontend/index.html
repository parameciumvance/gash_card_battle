<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>金色のガッシュベル!! THE CARD BATTLE</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header id="topbar">
    <span id="title"></span>
    <span id="identity"></span>
    <span id="turn-info"></span>
    <span id="phase-info"></span>
    <span id="acting-info"></span>
    <span id="countdown"></span>
    <span id="conn-status"></span>
    <button id="leave-room" class="hidden"></button>
  </header>

  <!-- 入口頁 -->
  <section id="landing" class="hidden">
    <h1 id="landing-title"></h1>
    <div id="assets-hint" class="hidden"></div>
    <div id="landing-cards">
      <div class="entry" id="entry-local">
        <h2></h2><p></p>
        <label class="deck-label" id="name-local-0-label"></label>
        <input id="name-local-0" class="name-input" maxlength="16">
        <label class="deck-label" id="deck-local-0-label"></label>
        <select id="deck-local-0" class="deck-select"></select>
        <label class="deck-label" id="name-local-1-label"></label>
        <input id="name-local-1" class="name-input" maxlength="16">
        <label class="deck-label" id="deck-local-1-label"></label>
        <select id="deck-local-1" class="deck-select"></select>
        <button class="primary"></button>
      </div>
      <div class="entry" id="entry-create">
        <h2></h2><p></p>
        <label class="deck-label" id="name-create-label"></label>
        <input id="name-create" class="name-input" maxlength="16">
        <label id="timer-label"></label>
        <select id="timer-select"></select>
        <label class="deck-label" id="deck-create-label"></label>
        <select id="deck-create" class="deck-select"></select>
        <button class="primary"></button>
      </div>
      <div class="entry" id="entry-join">
        <h2></h2><p></p>
        <input id="join-code" maxlength="6" placeholder="ABC123">
        <label class="deck-label" id="name-join-label"></label>
        <input id="name-join" class="name-input" maxlength="16">
        <label class="deck-label" id="deck-join-label"></label>
        <select id="deck-join" class="deck-select"></select>
        <button class="primary"></button>
      </div>
      <div class="entry" id="entry-builder">
        <h2></h2><p></p><button class="primary"></button>
      </div>
    </div>
  </section>

  <!-- 牌組構築器 -->
  <section id="builder" class="hidden">
    <div id="builder-head">
      <button id="builder-back"></button>
      <select id="builder-deck-list"></select>
      <select id="builder-new"></select>
      <input id="builder-name" maxlength="24">
      <button id="builder-save" class="primary"></button>
      <button id="builder-export"></button>
      <button id="builder-import"></button>
      <button id="builder-delete"></button>
    </div>
    <div id="builder-main">
      <div id="builder-pool">
        <div id="pool-filters"></div>
        <div id="pool-grid"></div>
      </div>
      <div id="builder-book">
        <div id="book-hint"></div>
        <div id="book-grid"></div>
      </div>
    </div>
    <div id="builder-validation"></div>
  </section>

  <div id="io-overlay" class="hidden">
    <div id="io-dialog">
      <h3 id="io-title"></h3>
      <textarea id="io-text" rows="4"></textarea>
      <div id="io-actions"></div>
    </div>
  </div>

  <!-- 等待對手 -->
  <section id="waiting" class="hidden">
    <h2 id="waiting-title"></h2>
    <div id="waiting-code" class="room-code"></div>
    <div class="share-row"><span id="share-join-label"></span>
      <input id="share-join" readonly><button data-copy="share-join"></button></div>
    <div class="share-row"><span id="share-spec-label"></span>
      <input id="share-spec" readonly><button data-copy="share-spec"></button></div>
  </section>

  <main id="layout" class="hidden">
    <section id="board">
      <div id="zone-top" class="player-zone top"></div>
      <div id="battle-stage"><div id="stage-content"></div></div>
      <div id="zone-bottom" class="player-zone bottom"></div>
      <div id="action-bar"></div>
    </section>
    <aside id="log-panel">
      <h3 id="log-title"></h3>
      <div id="log"></div>
    </aside>
  </main>

  <div id="anim-overlay"></div>

  <div id="dialog-overlay" class="hidden">
    <div id="dialog">
      <h3 id="dialog-title"></h3>
      <div id="dialog-options"></div>
    </div>
  </div>

  <div id="zoom-overlay" class="hidden">
    <div id="zoom-card"></div>
    <div id="zoom-actions"></div>
  </div>

  <div id="book-review-overlay" class="hidden">
    <div id="book-review">
      <div id="book-review-head">
        <h3 id="book-review-title"></h3>
        <button id="book-review-close"></button>
      </div>
      <div id="book-review-grid"></div>
    </div>
  </div>

  <div id="toast" class="hidden"></div>

  <script src="/static/decks.js"></script>
  <script src="/static/anim.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
